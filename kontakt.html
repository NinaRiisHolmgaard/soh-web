<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontaktform</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!--Navigation-->
    <header class="site-header">
        <a class="logo" href="index.html">
                <img src="images/logo-skjold.png" alt="logo - tilbage til forsiden" width="63" height="74">
            </a>
	
         <nav>
            <ul class="menu">
                <li><a href="index.html">Forside</a></li>
				<li><a href="koeb-via-hjemmesider.html">Guide hjemmesider</a></li>

                <img class="search" src="images/guides/søg.svg" width="22" height="22">
            </ul>
        </nav>
	</header>

     <!--Kontaktform - hovedindhold--> 
    <main class="kontaktform">
        <h1>Skriv for hjælp</h1>
            <p class="kontakt-tekst">Få hjælp til at tjekke eller andmelde en hjemmeside</p>

       <form>
        <label class="visually-hidden" for="Navn">Navn</label>
        <input id="Navn" type="text" placeholder="Navn" required>

        <label class="visually-hidden" for="Skriv din mail">E-mail</label>
        <input id="Skriv din mail" type="e-mail" placeholder="E-mail">

        <label class="visually-hidden" for="Skriv din adresse">Adresse</label>
        <input id="Skriv din adresse" type="text" placeholder="Adresse">

        <label class="visually-hidden" for="Skriv dit telefonnummer">Telefon</label>
        <input id="Skriv dit telefonnummer" type="tel" placeholder="Telefon">

       <!--Dropdown--> 

        <div class="custom select">
            <label for="Region">Hvad ønsker du hjælp til?</label>
            <select id="Region">
                <option value="0" selected="true" disabled>Vælg</option>
                <option value="1">Tjek om en hjemmeside er sikker</option>
                <option value="2">Anmeld en hjemmeside</option>
                <option value="3">Andet</option>
               
            </select>
        </div>

       

        </div>
             <label class="visually-hidden" for="hjemmeside">Hjemmeside</label>
        <input id="hjemmeside" type="hjemmeside" placeholder="Hjemmeside">
        
        <br>
        
<label for="Besked">Besked</label>
<textarea id="Besked" cols="30" rows="10"></textarea>

<fieldset>
    <Legend>Må vi kontakte dig på telefon</Legend>
    <input id="ja" type="radio" name="Kontakt">
    <label for="ja">Ja</label>

    <input id="Nej" type="radio" name="Kontakt">
    <label for="Nej">Nej</label>
</fieldset>

<input type="submit" name="submit" value="Send">


       </form>

       
    </main>
    <footer class="site-footer">
    <div class="footer-content">
        <img src="images/logo-skjold.png" alt="" width="63" height="74">
        <p class="footer-title">Sikker online handel</p>
        <p>Din guide til at handle sikkert på nettet.</p>

        <p class="footer-bottom">&copy; 2026 Sikker online handel</p>
    </div>
</footer>
</body>

</html>
